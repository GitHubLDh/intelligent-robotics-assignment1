#VRML_SIM R2023b utf8
# Simple differential-drive robot for FEUP reactive following assignment.
# Visible geometry: 1 cylindrical body and 2 cylindrical wheels.
# Local forward direction: +X. Lateral direction: +/-Y. Up: +Z.

PROTO SimpleDiffRobot [
  field SFVec3f translation 0 0 0.085
  field SFRotation rotation 0 0 1 0
  field SFString name "R1"
  field SFString controller "<none>"
  field SFColor bodyColor 0.13 0.70 0.93
  field MFNode debugVisual []  # Optional non-physical visualization geometry
]
{
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    model "simple_diff_robot"
    contactMaterial "body_support"
    controller IS controller
    recognitionColors [ 0.85 0.85 0.85 ]
    children [
      DEF BODY Shape {
        appearance PBRAppearance {
          baseColor IS bodyColor
          metalness 0
          roughness 0.65
        }
        geometry Cylinder {
          radius 0.115
          height 0.080
          subdivision 32
        }
      }
      # Front-facing recognition camera: 4 m range, 100 deg horizontal FOV.
      # Camera is slightly ahead of the body so the chassis does not block it.
      # Confirm the recognition API is accepted as local sensing by lecturer.
      Camera {
        translation 0.130 0 0.005
        name "front_camera"
        fieldOfView 1.745329252
        width 320
        height 160
        near 0.01
        far 4
        recognition Recognition {
          maxRange 4
          occlusion 2
        }
      }
      # Directional recognition by BODY HALVES, not small plaques: the front
      # half of the chassis is red, the rear half green. A half shell stays
      # visible across almost the whole viewing circle, where a flat plaque
      # shrinks to nothing as a robot turns away - which is what made leaders
      # unfollowable mid-turn. Each Solid is offset to its own side because
      # Webots recognition reports the Solid ORIGIN; sharing the centre would
      # make the two halves indistinguishable in position.
      Solid {
        translation 0.060 0 0.005
        name "front_red_half"
        model "front_half"
        recognitionColors [ 1 0 0 ]
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 1 0 0
              emissiveColor 0.6 0 0
              metalness 0
              roughness 0.6
            }
            geometry IndexedFaceSet {
              coord Coordinate {
                point [
                  -0.05588 -0.11793 -0.03750
                  -0.05588 -0.11793 0.03750
                  -0.03031 -0.11420 -0.03750
                  -0.03031 -0.11420 0.03750
                  -0.00617 -0.10500 -0.03750
                  -0.00617 -0.10500 0.03750
                  0.01540 -0.09077 -0.03750
                  0.01540 -0.09077 0.03750
                  0.03335 -0.07218 -0.03750
                  0.03335 -0.07218 0.03750
                  0.04682 -0.05014 -0.03750
                  0.04682 -0.05014 0.03750
                  0.05517 -0.02568 -0.03750
                  0.05517 -0.02568 0.03750
                  0.05800 0.00000 -0.03750
                  0.05800 0.00000 0.03750
                  0.05517 0.02568 -0.03750
                  0.05517 0.02568 0.03750
                  0.04682 0.05014 -0.03750
                  0.04682 0.05014 0.03750
                  0.03335 0.07218 -0.03750
                  0.03335 0.07218 0.03750
                  0.01540 0.09077 -0.03750
                  0.01540 0.09077 0.03750
                  -0.00617 0.10500 -0.03750
                  -0.00617 0.10500 0.03750
                  -0.03031 0.11420 -0.03750
                  -0.03031 0.11420 0.03750
                  -0.05588 0.11793 -0.03750
                  -0.05588 0.11793 0.03750
                ]
              }
              coordIndex [
                  0 2 3 1 -1
                  2 4 5 3 -1
                  4 6 7 5 -1
                  6 8 9 7 -1
                  8 10 11 9 -1
                  10 12 13 11 -1
                  12 14 15 13 -1
                  14 16 17 15 -1
                  16 18 19 17 -1
                  18 20 21 19 -1
                  20 22 23 21 -1
                  22 24 25 23 -1
                  24 26 27 25 -1
                  26 28 29 27 -1
              ]
            }
          }
        ]
      }
      Solid {
        translation -0.060 0 0.005
        name "rear_green_half"
        model "rear_half"
        recognitionColors [ 0 1 0 ]
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0 1 0
              emissiveColor 0 0.6 0
              metalness 0
              roughness 0.6
            }
            geometry IndexedFaceSet {
              coord Coordinate {
                point [
                  0.05588 0.11793 -0.03750
                  0.05588 0.11793 0.03750
                  0.03031 0.11420 -0.03750
                  0.03031 0.11420 0.03750
                  0.00617 0.10500 -0.03750
                  0.00617 0.10500 0.03750
                  -0.01540 0.09077 -0.03750
                  -0.01540 0.09077 0.03750
                  -0.03335 0.07218 -0.03750
                  -0.03335 0.07218 0.03750
                  -0.04682 0.05014 -0.03750
                  -0.04682 0.05014 0.03750
                  -0.05517 0.02568 -0.03750
                  -0.05517 0.02568 0.03750
                  -0.05800 0.00000 -0.03750
                  -0.05800 0.00000 0.03750
                  -0.05517 -0.02568 -0.03750
                  -0.05517 -0.02568 0.03750
                  -0.04682 -0.05014 -0.03750
                  -0.04682 -0.05014 0.03750
                  -0.03335 -0.07218 -0.03750
                  -0.03335 -0.07218 0.03750
                  -0.01540 -0.09077 -0.03750
                  -0.01540 -0.09077 0.03750
                  0.00617 -0.10500 -0.03750
                  0.00617 -0.10500 0.03750
                  0.03031 -0.11420 -0.03750
                  0.03031 -0.11420 0.03750
                  0.05588 -0.11793 -0.03750
                  0.05588 -0.11793 0.03750
                ]
              }
              coordIndex [
                  0 2 3 1 -1
                  2 4 5 3 -1
                  4 6 7 5 -1
                  6 8 9 7 -1
                  8 10 11 9 -1
                  10 12 13 11 -1
                  12 14 15 13 -1
                  14 16 17 15 -1
                  16 18 19 17 -1
                  18 20 21 19 -1
                  20 22 23 21 -1
                  22 24 25 23 -1
                  24 26 27 25 -1
                  26 28 29 27 -1
              ]
            }
          }
        ]
      }
      # World-space z assumes robot is upright on level ground.
      Lidar {
        translation 0 0 0.070
        name "safety_lidar"
        projection "cylindrical"
        type "fixed"
        # Frontal only: 100 deg horizontal, 4 m range, matching the camera
        # and the assignment's allowed-sensor rule.
        fieldOfView 1.745329252
        horizontalResolution 360
        numberOfLayers 3
        # Narrowed from 0.08: at the new 4 m range the lower layer of a 0.08
        # vertical FOV reaches the floor at 3.87 m and would report it as an
        # obstacle. 0.04 puts the floor intersection at 7.75 m, beyond range.
        verticalFieldOfView 0.04
        near 0.01
        minRange 0.05
        maxRange 4.0
      }
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor 0 0.125 -0.030
        }
        device [
          RotationalMotor {
            name "left_wheel_motor"
            maxVelocity 12
            acceleration 5
            maxTorque 1.5
          }
        ]
        endPoint Solid {
          translation 0 0.125 -0.030
          rotation 1 0 0 1.570796327
          name "left_wheel"
          contactMaterial "wheel_rubber"
          children [
            DEF WHEEL_SHAPE Shape {
              appearance PBRAppearance {
                baseColor 0.07 0.08 0.10
                metalness 0
                roughness 0.95
              }
              geometry DEF WHEEL_GEOMETRY Cylinder {
                radius 0.055
                height 0.028
                subdivision 24
              }
            }
          ]
          boundingObject USE WHEEL_GEOMETRY
          physics Physics {
            density -1
            mass 0.05
          }
        }
      }
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor 0 -0.125 -0.030
        }
        device [
          RotationalMotor {
            name "right_wheel_motor"
            maxVelocity 12
            acceleration 5
            maxTorque 1.5
          }
        ]
        endPoint Solid {
          translation 0 -0.125 -0.030
          rotation 1 0 0 1.570796327
          name "right_wheel"
          contactMaterial "wheel_rubber"
          children [
            USE WHEEL_SHAPE
          ]
          boundingObject USE WHEEL_GEOMETRY
          physics Physics {
            density -1
            mass 0.05
          }
        }
      }
      # Invisible bumper for experimental contact-episode counting only.
      # Centered above the floor to avoid counting ground contact.
      # Radius 0.146 m slightly exceeds the chassis/wheel outer envelope;
      # collisions are sensed locally, never using global coordinates.
      TouchSensor {
        name "collision_bumper"
        contactMaterial "body_support"
        type "bumper"
        boundingObject Cylinder {
          radius 0.146
          height 0.045
          subdivision 24
        }
      }
      # Optional floor-level FOV wireframe: no boundingObject or physics.
      # This is visualization only, not a camera detection or obstacle sensor.
      Pose {
        children IS debugVisual
      }
    ]
    # Two passive front/rear anti-tip contacts; 2mm resting clearance avoids
    # fighting the powered wheel contacts and reduces frictional wobble.
    # No orientation forcing or privileged sensing.
    boundingObject Group {
      children [
        Cylinder {
          radius 0.115
          height 0.080
          subdivision 32
        }
        Pose {
          translation -0.090 0 -0.067
          children [ Sphere { radius 0.016 } ]
        }
        Pose {
          translation 0.090 0 -0.067
          children [ Sphere { radius 0.016 } ]
        }
      ]
    }
    physics Physics {
      density -1
      mass 0.65
      centerOfMass [ 0 0 -0.038 ]
      damping Damping { linear 0.15 angular 0.28 }
    }
  }
}
